<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Secret 2 of 2</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background-color: #000; color: #fff; font-family: 'Courier New', Courier, monospace;
            touch-action: none; user-select: none;
        }

        /* Glitch Animation Effects */
        @keyframes glitch-anim {
            0% { clip-path: inset(10% 0 80% 0); transform: translate(-2px, 2px); }
            20% { clip-path: inset(80% 0 10% 0); transform: translate(2px, -2px); }
            40% { clip-path: inset(30% 0 50% 0); transform: translate(-2px, 2px); filter: hue-rotate(90deg); }
            60% { clip-path: inset(70% 0 20% 0); transform: translate(2px, -2px); }
            80% { clip-path: inset(20% 0 60% 0); transform: translate(-2px, 2px); filter: hue-rotate(180deg); }
            100% { clip-path: inset(50% 0 30% 0); transform: translate(2px, -2px); }
        }

        @keyframes noise {
            0%, 100% { background-position: 0 0; }
            10% { background-position: -5% -10%; }
            30% { background-position: 7% -25%; }
            50% { background-position: -25% 10%; }
            70% { background-position: 0% 15%; }
            90% { background-position: -10% 10%; }
        }

        /* UI Screens */
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10; background-color: #000;
        }

        #intro-screen { z-index: 20; }
        #game-over-screen, #level-up-screen { display: none; z-index: 15; background-color: rgba(0,0,0,0.85); }

        /* The Glitched Secret Text */
        .glitch-text { font-size: 2.5rem; font-weight: bold; position: relative; text-transform: uppercase; letter-spacing: 4px; display: block; text-align: center; }
        .glitch-text::before, .glitch-text::after {
            content: 'Secret 2 of 2'; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000;
        }
        .glitch-text::before { left: 2px; text-shadow: -2px 0 red; animation: glitch-anim 0.3s infinite linear alternate-reverse; }
        .glitch-text::after { left: -2px; text-shadow: -2px 0 blue; animation: glitch-anim 0.2s infinite linear alternate-reverse; }

        .noise-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.05) 2px, rgba(255,255,255,0.05) 4px);
            z-index: 19; opacity: 0.5; display: block; animation: noise 0.2s infinite;
        }

        /* Buttons and UI Elements */
        .btn {
            padding: 15px 40px; font-size: 1.5rem; color: #fff; background: transparent; border: 2px solid #fff;
            cursor: pointer; text-transform: uppercase; font-family: inherit; transition: all 0.2s; margin: 10px; display: none;
            text-shadow: 0 0 5px #fff; box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }
        .btn:hover { background: #fff; color: #000; box-shadow: 0 0 20px #fff; }

        #hud {
            position: absolute; top: 0; left: 0; width: 100%; padding: 10px;
            display: flex; flex-direction: column; gap: 5px; box-sizing: border-box; z-index: 5; display: none; pointer-events: none;
        }
        .bar-container { width: 100%; height: 15px; border: 2px solid #fff; background: #333; position: relative; }
        #xp-bar { height: 100%; background: #3498db; width: 0%; transition: width 0.2s; }
        #health-bar { height: 100%; background: #e74c3c; width: 100%; transition: width 0.2s; }
        #hud-top-row { display: flex; justify-content: space-between; font-weight: bold; font-size: 1.2rem; text-shadow: 1px 1px 2px #000; margin-top: 5px; }

        /* Level Up Menu */
        .upgrade-card {
            background: #1a1a1a; border: 2px solid #444; padding: 20px; margin: 10px; width: 80%; max-width: 400px;
            cursor: pointer; text-align: center; transition: transform 0.1s; display: flex; flex-direction: column; gap: 10px;
        }
        .upgrade-card:hover { transform: scale(1.02); border-color: #fff; }
        .upgrade-title { font-size: 1.3rem; color: #f1c40f; font-weight: bold; }
        .upgrade-desc { font-size: 1rem; color: #ccc; }

        /* Game Canvas */
        #gameCanvas { display: none; width: 100%; height: 100%; }

        /* Virtual Joystick */
        #joystick-container {
            position: absolute; bottom: 40px; left: 40px; width: 120px; height: 120px;
            background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%; z-index: 20; display: none; touch-action: none;
        }
        #joystick-knob {
            position: absolute; top: 50%; left: 50%; width: 50px; height: 50px;
            background: rgba(255, 255, 255, 0.6); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none;
        }
        @media (pointer: coarse) { #joystick-container { display: block; } }
    </style>
</head>
<body>

    <div id="intro-screen" class="screen">
        <div class="glitch-text" id="secret-text">Secret 2 of 2</div>
        <button class="btn" id="begin-btn">Begin</button>
    </div>

    <div class="noise-overlay" id="noise-overlay"></div>

    <div id="hud">
        <div class="bar-container"><div id="xp-bar"></div></div>
        <div id="hud-top-row">
            <span id="level-display">LVL 1</span>
            <div class="bar-container" style="width: 200px; height: 15px; border: 1px solid #fff; position: relative; top: -2px;">
                <div id="health-bar"></div>
            </div>
            <span id="time-display">00:00</span>
        </div>
    </div>

    <div id="level-up-screen" class="screen">
        <h1 style="color: #f1c40f; margin-bottom: 10px; font-size: 2.5rem; text-shadow: 0 0 10px #f1c40f;">LEVEL UP!</h1>
        <div id="upgrade-options" style="display: flex; flex-direction: column; align-items: center; width: 100%;"></div>
    </div>

    <div id="game-over-screen" class="screen">
        <h1 style="color: #e74c3c; font-size: 3rem; text-shadow: 0 0 15px #e74c3c;">SYSTEM FAILURE</h1>
        <h2 id="final-stats" style="margin: 20px 0; color: #aaa;">Level: 1 | Time: 00:00</h2>
        <button class="btn" id="restart-btn" style="display: block; border-color: #e74c3c; color: #e74c3c; text-shadow: none; box-shadow: none;">Try Again</button>
    </div>

    <div id="joystick-container"><div id="joystick-knob"></div></div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Image Assets (Silent Fallback if missing)
        const playerImg = new Image(); playerImg.src = 'player.png';
        let playerImgLoaded = false; playerImg.onload = () => playerImgLoaded = true;

        const enemyImg = new Image(); enemyImg.src = 'bradley.png';
        let enemyImgLoaded = false; enemyImg.onload = () => enemyImgLoaded = true;

        // UI References
        const ui = {
            intro: document.getElementById('intro-screen'),
            secretText: document.getElementById('secret-text'),
            beginBtn: document.getElementById('begin-btn'),
            noise: document.getElementById('noise-overlay'),
            gameOver: document.getElementById('game-over-screen'),
            levelUp: document.getElementById('level-up-screen'),
            hud: document.getElementById('hud'),
            xpBar: document.getElementById('xp-bar'),
            hpBar: document.getElementById('health-bar'),
            lvlDisp: document.getElementById('level-display'),
            timeDisp: document.getElementById('time-display'),
            upgradeOpts: document.getElementById('upgrade-options'),
            joyCont: document.getElementById('joystick-container'),
            joyKnob: document.getElementById('joystick-knob')
        };

        // Core State
        let gameState = 'INTRO'; // INTRO, WAITING, PLAYING, LEVELUP, GAMEOVER
        let lastTime = 0, gameTime = 0, animationFrameId;
        let camX = 0, camY = 0;

        // Entities
        let player, enemies, xpGems, projectiles, puddles, damageTexts;
        let pendingAttacks = [];

        const WEAPON_DATA = {
            fists: {
                name: "Fists",
                levels: [
                    { desc: "Punches forward. Long range.", damage: 1, size: 2, cooldown: 1200 },
                    { desc: "Punches forward, then backward.", damage: 1, size: 2, cooldown: 1200 },
                    { desc: "Increases attack area.", damage: 1, size: 3.5, cooldown: 1200 },
                    { desc: "1-shots basic enemies.", damage: 2, size: 3.5, cooldown: 800 },
                    { desc: "Massive damage and size.", damage: 4, size: 5, cooldown: 800 }
                ]
            },
            bathwater: {
                name: "Bath Water",
                levels: [
                    { desc: "Throws a puddle that damages over time.", damage: 6.25, radius: 70, duration: 3000, cooldown: 2500 },
                    { desc: "Larger puddle.", damage: 6.25, radius: 100, duration: 3000, cooldown: 2500 },
                    { desc: "Higher damage, lasts longer.", damage: 12.5, radius: 100, duration: 4000, cooldown: 2500 },
                    { desc: "Throws more frequently.", damage: 12.5, radius: 120, duration: 4000, cooldown: 1500 },
                    { desc: "Huge toxic area, high damage.", damage: 25, radius: 160, duration: 5000, cooldown: 1500 }
                ]
            },
            garlic: {
                name: "Mogging Aura",
                levels: [
                    { desc: "Damages nearby enemies.", damage: 4, radius: 100, cooldown: 1000 },
                    { desc: "Increases aura radius.", damage: 4, radius: 120, cooldown: 1000 },
                    { desc: "Increases damage.", damage: 8, radius: 120, cooldown: 1000 },
                    { desc: "Ticks faster.", damage: 8, radius: 120, cooldown: 500 },
                    { desc: "Huge area and damage.", damage: 15, radius: 160, cooldown: 500 }
                ]
            },
            wand: {
                name: "Magic Wand",
                levels: [
                    { desc: "Fires at nearest enemy.", damage: 15, speed: 400, cooldown: 1200, pierce: 1 },
                    { desc: "Fires faster.", damage: 15, speed: 450, cooldown: 800, pierce: 1 },
                    { desc: "Projectiles pierce an enemy.", damage: 25, speed: 450, cooldown: 800, pierce: 2 },
                    { desc: "Fires very rapidly.", damage: 25, speed: 500, cooldown: 400, pierce: 2 },
                    { desc: "High damage and piercing.", damage: 40, speed: 600, cooldown: 300, pierce: 3 }
                ]
            }
        };

        const keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false };
        let joyVec = { x: 0, y: 0 };

        window.addEventListener('keydown', e => { if(keys.hasOwnProperty(e.key)) keys[e.key] = true; });
        window.addEventListener('keyup', e => { if(keys.hasOwnProperty(e.key)) keys[e.key] = false; });

        let isDragging = false, joyCenter = { x: 0, y: 0 };
        const maxDist = 60;

        function updateJoyCenter() {
            const rect = ui.joyCont.getBoundingClientRect();
            joyCenter.x = rect.left + rect.width / 2;
            joyCenter.y = rect.top + rect.height / 2;
        }

        ui.joyCont.addEventListener('touchstart', e => { e.preventDefault(); isDragging = true; updateJoyCenter(); handleJoy(e.touches[0]); }, { passive: false });
        ui.joyCont.addEventListener('touchmove', e => { e.preventDefault(); if(isDragging) handleJoy(e.touches[0]); }, { passive: false });
        ui.joyCont.addEventListener('touchend', e => { e.preventDefault(); isDragging = false; joyVec = {x:0, y:0}; ui.joyKnob.style.transform = `translate(-50%, -50%)`; }, { passive: false });

        function handleJoy(touch) {
            let dx = touch.clientX - joyCenter.x, dy = touch.clientY - joyCenter.y;
            let dist = Math.hypot(dx, dy);
            if (dist > maxDist) { dx = (dx/dist)*maxDist; dy = (dy/dist)*maxDist; }
            ui.joyKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
            joyVec.x = dist>0 ? dx/maxDist : 0; joyVec.y = dist>0 ? dy/maxDist : 0;
        }

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            if(gameState === 'PLAYING') updateJoyCenter();
        });

        // Exact 3 second timer for intro text
        setTimeout(() => {
            if (gameState === 'INTRO') {
                ui.secretText.style.display = 'none';
                ui.beginBtn.style.display = 'block';
                ui.noise.style.opacity = '0.15'; // Dim noise slightly
                gameState = 'WAITING';
            }
        }, 3000);

        ui.beginBtn.addEventListener('click', () => {
            ui.intro.style.display = 'none';
            ui.noise.style.display = 'none';
            // Request Fullscreen on user gesture
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch((e)=>console.warn("Fullscreen denied:", e));
            }
            initGame();
        });

        function initGame() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            canvas.style.display = 'block';
            ui.hud.style.display = 'flex';
            if ('ontouchstart' in window || navigator.maxTouchPoints > 0) ui.joyCont.style.display = 'block';

            player = {
                x: 0, y: 0, w: 64, h: 129, speed: 200, hp: 100, maxHp: 100,
                xp: 0, maxXp: 10, level: 1, facingLeft: false,
                weapons: { fists: { level: 1, last: 0 } } // Start with Fists
            };

            enemies = []; xpGems = []; projectiles = []; puddles = []; damageTexts = []; pendingAttacks = [];
            gameTime = 0; lastTime = performance.now();
            gameState = 'PLAYING';
            updateHUD();
            requestAnimationFrame(gameLoop);
        }

        function spawnEnemy() {
            const angle = Math.random() * Math.PI * 2;
            const dist = Math.max(canvas.width, canvas.height) / 2 + 150;
            
            let scale = 1;
            if (gameTime >= 180000) { // 3 minutes = 180,000 ms
                let r = Math.random();
                if (r > 0.8) scale = 2; // 20% chance for 2x size/hp
                else if (r > 0.5) scale = 1.5; // 30% chance for 1.5x size/hp
            }
            const hpBase = 2 * scale; // 2 hits for 1x, 3 hits for 1.5x, 4 hits for 2x
            
            enemies.push({
                x: player.x + Math.cos(angle) * dist,
                y: player.y + Math.sin(angle) * dist,
                w: 48 * scale, h: 64 * scale,
                // Slower enemies: Base ~50, highly randomized
                speed: 40 + Math.random() * 30 + (gameTime / 60000 * 5),
                hp: hpBase, maxHp: hpBase, color: '#c0392b'
            });
        }

        function spawnDamageText(x, y, amt) {
            damageTexts.push({ x, y: y - 20, text: Math.floor(amt).toString(), life: 600, maxLife: 600 });
        }

        function triggerFistAttack(stats, isLeft) {
            let hw = 120 * stats.size; // Doubled range horizontally
            let hh = 50 * Math.max(1, stats.size * 0.5);
            
            let hx = isLeft ? player.x - player.w/2 - hw : player.x + player.w/2;
            let hy = player.y - hh/2;
            
            projectiles.push({
                type: 'fists', x: hx, y: hy, w: hw, h: hh, 
                damage: stats.damage, life: 150, hitList: [], isLeft: isLeft
            });
        }

        function fireWeapons(now) {
            // 1. FISTS
            if (player.weapons.fists) {
                let w = player.weapons.fists;
                let stats = WEAPON_DATA.fists.levels[w.level - 1];
                if (now - w.last > stats.cooldown) {
                    w.last = now;
                    // First hit (facing direction)
                    triggerFistAttack(stats, player.facingLeft);

                    // Second hit (opposite direction, staggered by 200ms) for Level 2+
                    if (w.level >= 2) {
                        pendingAttacks.push({
                            type: 'fists',
                            timer: 200,
                            isLeft: !player.facingLeft, // Opposite of CURRENT facing
                            stats: stats
                        });
                    }
                }
            }

            // 2. BATH WATER
            if (player.weapons.bathwater) {
                let bw = player.weapons.bathwater;
                let stats = WEAPON_DATA.bathwater.levels[bw.level - 1];
                if (now - bw.last > stats.cooldown) {
                    bw.last = now;
                    // Pick a random spot near player (within 300px)
                    let angle = Math.random() * Math.PI * 2;
                    let dist = 50 + Math.random() * 250;
                    let targetX = player.x + Math.cos(angle) * dist;
                    let targetY = player.y + Math.sin(angle) * dist;

                    puddles.push({
                        x: targetX, y: targetY,
                        radius: stats.radius,
                        damage: stats.damage,
                        life: stats.duration,
                        maxLife: stats.duration,
                        nextTick: 0
                    });
                }
            }

            // 3. GARLIC
            if (player.weapons.garlic) {
                let g = player.weapons.garlic;
                let stats = WEAPON_DATA.garlic.levels[g.level - 1];
                if (now - g.last > stats.cooldown) {
                    g.last = now;
                    for (let e of enemies) {
                        if (Math.hypot(e.x - player.x, e.y - player.y) <= stats.radius) {
                            e.hp -= stats.damage;
                            spawnDamageText(e.x, e.y, stats.damage);
                        }
                    }
                }
            }

            // 4. WAND
            if (player.weapons.wand) {
                let m = player.weapons.wand;
                let stats = WEAPON_DATA.wand.levels[m.level - 1];
                if (now - m.last > stats.cooldown) {
                    let closest = null, minDist = Infinity;
                    for(let e of enemies) {
                        let d = Math.hypot(e.x - player.x, e.y - player.y);
                        if(d < minDist) { minDist = d; closest = e; }
                    }
                    if (closest) {
                        m.last = now;
                        let angle = Math.atan2(closest.y - player.y, closest.x - player.x);
                        projectiles.push({
                            type: 'wand', x: player.x, y: player.y, 
                            vx: Math.cos(angle) * stats.speed, vy: Math.sin(angle) * stats.speed,
                            damage: stats.damage, radius: 10, life: 3000, pierce: stats.pierce, hitList: []
                        });
                    }
                }
            }
        }

        function update(dt) {
            const dtSec = dt / 1000;
            gameTime += dt;

            // Player Movement
            let mx = 0, my = 0;
            if(keys.w || keys.ArrowUp) my -= 1;
            if(keys.s || keys.ArrowDown) my += 1;
            if(keys.a || keys.ArrowLeft) mx -= 1;
            if(keys.d || keys.ArrowRight) mx += 1;

            if(joyVec.x !== 0 || joyVec.y !== 0) { mx = joyVec.x; my = joyVec.y; }
            else if(mx !== 0 || my !== 0) { let d = Math.hypot(mx, my); mx/=d; my/=d; }

            player.x += mx * player.speed * dtSec;
            player.y += my * player.speed * dtSec;
            if(mx < 0) player.facingLeft = true;
            if(mx > 0) player.facingLeft = false;

            // Camera bounds
            camX = player.x - canvas.width / 2;
            camY = player.y - canvas.height / 2;

            // Process Pending Attacks (Staggered Fists)
            for (let i = pendingAttacks.length - 1; i >= 0; i--) {
                let p = pendingAttacks[i];
                p.timer -= dt;
                if (p.timer <= 0) {
                    if (p.type === 'fists') triggerFistAttack(p.stats, p.isLeft);
                    pendingAttacks.splice(i, 1);
                }
            }

            fireWeapons(performance.now());

            // Update Projectiles
            for (let i = projectiles.length - 1; i >= 0; i--) {
                let p = projectiles[i];
                p.life -= dt;
                
                if (p.type === 'wand') {
                    p.x += p.vx * dtSec; p.y += p.vy * dtSec;
                    for (let e of enemies) {
                        if (p.hitList.includes(e)) continue;
                        if (Math.hypot(e.x - p.x, e.y - p.y) < p.radius + e.w/2) {
                            e.hp -= p.damage;
                            spawnDamageText(e.x, e.y, p.damage);
                            p.hitList.push(e);
                            p.pierce--;
                            if (p.pierce <= 0) p.life = 0; 
                            break;
                        }
                    }
                } else if (p.type === 'fists') {
                    // Lock fists onto player relative position while active
                    p.x = p.isLeft ? player.x - player.w/2 - p.w : player.x + player.w/2;
                    p.y = player.y - p.h/2;
                    
                    for (let e of enemies) {
                        if (p.hitList.includes(e)) continue;
                        if (e.x + e.w/2 > p.x && e.x - e.w/2 < p.x + p.w &&
                            e.y + e.h/2 > p.y && e.y - e.h/2 < p.y + p.h) {
                            e.hp -= p.damage;
                            spawnDamageText(e.x, e.y, p.damage);
                            p.hitList.push(e);
                        }
                    }
                }

                if (p.life <= 0) projectiles.splice(i, 1);
            }

            // Update Bath Water Puddles
            for (let i = puddles.length - 1; i >= 0; i--) {
                let pud = puddles[i];
                pud.life -= dt;
                if (pud.life <= 0) {
                    puddles.splice(i, 1);
                    continue;
                }
                
                // Tick damage every 500ms
                pud.nextTick -= dt;
                if (pud.nextTick <= 0) {
                    pud.nextTick = 500;
                    for (let e of enemies) {
                        if (Math.hypot(e.x - pud.x, e.y - pud.y) <= pud.radius) {
                            e.hp -= pud.damage;
                            spawnDamageText(e.x, e.y, pud.damage);
                        }
                    }
                }
            }

            // Update Enemies & Check Health Drain
            let takingDamage = false;
            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                if (e.hp <= 0) {
                    // Drop gem
                    xpGems.push({ x: e.x, y: e.y, value: 1 + Math.floor(player.level * 0.3), radius: 6, color: '#2ecc71' });
                    enemies.splice(i, 1);
                    continue;
                }
                
                let angle = Math.atan2(player.y - e.y, player.x - e.x);
                e.x += Math.cos(angle) * e.speed * dtSec;
                e.y += Math.sin(angle) * e.speed * dtSec;

                // Simple Box Overlap Check
                if (Math.abs(player.x - e.x) < (player.w/2 + e.w/2 - 15) && 
                    Math.abs(player.y - e.y) < (player.h/2 + e.h/2 - 15)) {
                    takingDamage = true;
                }
            }

            // Apply constant health drain (flat 25 HP/sec regardless of # of enemies)
            if (takingDamage) {
                player.hp -= 25 * dtSec;
            }

            // Update Gems
            const magRange = 180;
            for (let i = xpGems.length - 1; i >= 0; i--) {
                let g = xpGems[i];
                let d = Math.hypot(player.x - g.x, player.y - g.y);
                if (d < magRange) {
                    let a = Math.atan2(player.y - g.y, player.x - g.x);
                    g.x += Math.cos(a) * 500 * dtSec;
                    g.y += Math.sin(a) * 500 * dtSec;
                    
                    if (d < 25) { 
                        player.xp += g.value;
                        xpGems.splice(i, 1);
                        checkLevelUp();
                    }
                }
            }

            // Update Damage Texts
            for(let i=damageTexts.length-1; i>=0; i--){
                damageTexts[i].y -= 25 * dtSec;
                damageTexts[i].life -= dt;
                if(damageTexts[i].life <= 0) damageTexts.splice(i,1);
            }

            // Spawn Logic
            let spawnRate = Math.max(250, 1500 - (gameTime / 60000 * 900));
            if (gameTime >= 180000) spawnRate /= 1.5; // 50% more enemies after 3 mins
            
            if (Math.random() < (dt / spawnRate)) spawnEnemy();

            updateHUD();
            if (player.hp <= 0) endGame();
        }

        function checkLevelUp() {
            if (player.xp >= player.maxXp) {
                player.level++;
                player.xp -= player.maxXp;
                player.maxXp = Math.floor(player.maxXp * 1.6);
                player.hp = player.maxHp; // Full Heal on level up
                triggerLevelUp();
            }
        }

        function triggerLevelUp() {
            gameState = 'LEVELUP';
            ui.upgradeOpts.innerHTML = '';
            ui.levelUp.style.display = 'flex';
            ui.joyCont.style.display = 'none';

            let pool = [];
            for (let [key, data] of Object.entries(WEAPON_DATA)) {
                let curLvl = player.weapons[key] ? player.weapons[key].level : 0;
                if (curLvl < data.levels.length) {
                    pool.push({
                        id: key,
                        title: curLvl === 0 ? `Unlock: ${data.name}` : `Upgrade: ${data.name} (Lv ${curLvl+1})`,
                        desc: data.levels[curLvl].desc
                    });
                }
            }

            // Pick up to 3 random options
            pool.sort(() => Math.random() - 0.5);
            let choices = pool.slice(0, 3);
            
            if (choices.length === 0) {
                choices.push({ id: 'heal', title: 'Full Heal', desc: 'Restores HP to maximum.' });
            }

            choices.forEach(c => {
                let btn = document.createElement('div');
                btn.className = 'upgrade-card';
                btn.innerHTML = `<div class="upgrade-title">${c.title}</div><div class="upgrade-desc">${c.desc}</div>`;
                btn.onclick = () => {
                    if (c.id === 'heal') {
                        player.hp = player.maxHp;
                    } else {
                        if (!player.weapons[c.id]) player.weapons[c.id] = { level: 1, last: performance.now() };
                        else player.weapons[c.id].level++;
                    }
                    
                    ui.levelUp.style.display = 'none';
                    if ('ontouchstart' in window || navigator.maxTouchPoints > 0) ui.joyCont.style.display = 'block';
                    gameState = 'PLAYING';
                    lastTime = performance.now(); 
                    requestAnimationFrame(gameLoop);
                };
                ui.upgradeOpts.appendChild(btn);
            });
        }

        function draw() {
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.save();
            ctx.translate(-camX, -camY);

            // Draw Background Grid 
            ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 2;
            const gridSize = 150;
            let startX = Math.floor(camX / gridSize) * gridSize;
            let startY = Math.floor(camY / gridSize) * gridSize;
            
            ctx.beginPath();
            for(let x = startX; x < camX + canvas.width + gridSize; x += gridSize) {
                ctx.moveTo(x, camY); ctx.lineTo(x, camY + canvas.height);
            }
            for(let y = startY; y < camY + canvas.height + gridSize; y += gridSize) {
                ctx.moveTo(camX, y); ctx.lineTo(camX + canvas.width, y);
            }
            ctx.stroke();

            // Draw Puddles (Bath Water)
            for (let pud of puddles) {
                ctx.beginPath();
                ctx.arc(pud.x, pud.y, pud.radius, 0, Math.PI*2);
                let alpha = (pud.life / pud.maxLife) * 0.4;
                ctx.fillStyle = `rgba(52, 152, 219, ${alpha})`; // Blue puddle
                ctx.fill();
                ctx.strokeStyle = `rgba(41, 128, 185, ${alpha + 0.2})`;
                ctx.lineWidth = 3;
                ctx.stroke();
            }

            // Draw Garlic Aura
            if (player.weapons.garlic) {
                let stats = WEAPON_DATA.garlic.levels[player.weapons.garlic.level - 1];
                ctx.beginPath();
                ctx.arc(player.x, player.y, stats.radius, 0, Math.PI*2);
                ctx.fillStyle = 'rgba(241, 196, 15, 0.1)';
                ctx.fill();
                ctx.strokeStyle = 'rgba(241, 196, 15, 0.3)';
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            // Draw Gems
            for (let g of xpGems) {
                ctx.fillStyle = g.color;
                ctx.beginPath(); ctx.arc(g.x, g.y, g.radius, 0, Math.PI*2); ctx.fill();
                ctx.shadowBlur = 5; ctx.shadowColor = g.color; ctx.fill(); ctx.shadowBlur = 0; // slight glow
            }

            // Draw Enemies
            for (let e of enemies) {
                if (enemyImgLoaded) {
                    ctx.drawImage(enemyImg, e.x - e.w/2, e.y - e.h/2, e.w, e.h);
                } else {
                    ctx.fillStyle = e.color;
                    ctx.fillRect(e.x - e.w/2, e.y - e.h/2, e.w, e.h);
                }
                // HP Bar
                if (e.hp < e.maxHp) {
                    ctx.fillStyle = '#555'; ctx.fillRect(e.x - e.w/2, e.y - e.h/2 - 10, e.w, 4);
                    ctx.fillStyle = '#e74c3c'; ctx.fillRect(e.x - e.w/2, e.y - e.h/2 - 10, e.w * (e.hp/e.maxHp), 4);
                }
            }

            // Draw Projectiles
            for (let p of projectiles) {
                if (p.type === 'wand') {
                    ctx.fillStyle = '#9b59b6'; // Purple wand shot
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(p.x-2, p.y-2, p.radius/3, 0, Math.PI*2); ctx.fill();
                } else if (p.type === 'fists') {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.7)'; // Swipe effect
                    ctx.beginPath();
                    if(p.isLeft) {
                        ctx.moveTo(p.x + p.w, p.y);
                        ctx.quadraticCurveTo(p.x, p.y + p.h/2, p.x + p.w, p.y + p.h);
                    } else {
                        ctx.moveTo(p.x, p.y);
                        ctx.quadraticCurveTo(p.x + p.w, p.y + p.h/2, p.x, p.y + p.h);
                    }
                    ctx.fill();
                }
            }

            // Draw Player
            ctx.save();
            if (player.facingLeft) {
                ctx.translate(player.x, player.y); ctx.scale(-1, 1); ctx.translate(-player.x, -player.y);
            }
            if (playerImgLoaded) {
                ctx.drawImage(playerImg, player.x - player.w/2, player.y - player.h/2, player.w, player.h);
            } else {
                ctx.fillStyle = '#3498db';
                ctx.fillRect(player.x - player.w/2, player.y - player.h/2, player.w, player.h);
                // Eye indicator
                ctx.fillStyle = '#fff'; ctx.fillRect(player.x + 10, player.y - 20, 10, 10);
            }
            ctx.restore();

            // Draw Damage Texts
            ctx.font = 'bold 18px Arial';
            ctx.textAlign = 'center';
            for (let d of damageTexts) {
                ctx.fillStyle = `rgba(255, 255, 255, ${d.life/d.maxLife})`;
                ctx.fillText(d.text, d.x, d.y);
            }

            ctx.restore();
        }

        function updateHUD() {
            ui.xpBar.style.width = Math.min(100, (player.xp / player.maxXp) * 100) + '%';
            ui.hpBar.style.width = Math.max(0, (player.hp / player.maxHp) * 100) + '%';
            ui.lvlDisp.innerText = 'LVL ' + player.level;
            
            let totalSeconds = Math.floor(gameTime / 1000);
            let m = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
            let s = String(totalSeconds % 60).padStart(2, '0');
            ui.timeDisp.innerText = `${m}:${s}`;
        }

        function gameLoop(timestamp) {
            if (gameState !== 'PLAYING') return;
            let dt = timestamp - lastTime;
            lastTime = timestamp;
            if (dt > 100) dt = 16; 
            
            update(dt);
            draw();
            
            if(gameState === 'PLAYING') animationFrameId = requestAnimationFrame(gameLoop);
        }

        function endGame() {
            gameState = 'GAMEOVER';
            cancelAnimationFrame(animationFrameId);
            
            let totalSeconds = Math.floor(gameTime / 1000);
            let m = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
            let s = String(totalSeconds % 60).padStart(2, '0');
            
            document.getElementById('final-stats').innerText = `Level: ${player.level} | Survived: ${m}:${s}`;
            ui.gameOver.style.display = 'flex';
            ui.joyCont.style.display = 'none';
        }

        document.getElementById('restart-btn').addEventListener('click', () => {
            ui.gameOver.style.display = 'none';
            initGame();
        });
    </script>
</body>
</html>
